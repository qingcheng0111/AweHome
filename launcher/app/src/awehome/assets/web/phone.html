<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AweHome</title>
<style>
  :root { --bg:#0e0f12; --card:#1a1c21; --line:#2a2d34; --text:#f2f2f4; --dim:#9a9ca4; --accent:#4c8dff; --danger:#ff5b5b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:6px 0 2px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; }
  h2 { font-size:16px; margin:0 0 4px; }
  p.hint { color:var(--dim); font-size:13px; margin:0 0 12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button, .file { appearance:none; border:0; border-radius:12px; padding:10px 14px; font:inherit; color:#fff; background:var(--accent); cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  .file input { display:none; }
  input[type=text], select { flex:1; min-width:0; background:#0b0c0f; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin-top:12px; }
  .thumb { position:relative; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#000; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button { position:absolute; top:6px; right:6px; padding:4px 9px; border-radius:999px; background:rgba(0,0,0,.6); font-size:12px; }
  .empty { color:var(--dim); font-size:13px; margin-top:8px; }
  .status { min-height:20px; color:var(--dim); font-size:13px; margin-top:8px; }
  .preview { margin-top:12px; width:220px; aspect-ratio:16/9; border-radius:10px; overflow:hidden; background:#000; display:none; }
  .preview img { width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
<main>
  <h1 data-t="title">AweHome</h1>
  <div class="sub"><span data-t="device">电视</span>：{{DEVICE}}</div>

  <section>
    <h2 data-t="wallTitle">墙纸文件夹</h2>
    <p class="hint" data-t="wallHint">从手机选几张照片发到电视。电视上点一下图片就能删除。</p>
    <div class="row">
      <label class="file"><span data-t="choose">选择照片</span><input id="photos" type="file" accept="image/*" multiple></label>
      <button class="ghost" id="useFolder" data-t="useFolder">设为桌面背景</button>
    </div>
    <div class="status" id="wallStatus"></div>
    <div class="grid" id="walls"></div>
    <div class="empty" id="wallsEmpty" data-t="wallsEmpty">还没有照片。</div>
  </section>

  <section>
    <h2 data-t="iconTitle">App 图标</h2>
    <p class="hint" data-t="iconHint">给一个 App 换一张自己的图，会裁成 16:9 显示在磁贴上。</p>
    <div class="row">
      <select id="app"></select>
    </div>
    <div class="preview" id="preview"><img id="previewImg" alt=""></div>
    <div class="row" style="margin-top:12px">
      <label class="file"><span data-t="chooseIcon">选择图片</span><input id="icon" type="file" accept="image/*"></label>
      <button class="ghost" id="resetIcon" data-t="resetIcon">恢复默认</button>
    </div>
    <div class="status" id="iconStatus"></div>
  </section>

  <section>
    <h2 data-t="weatherTitle">天气城市</h2>
    <p class="hint" id="weatherNow"></p>
    <div class="row">
      <input type="text" id="city" data-p="cityHint" placeholder="例如：上海、杭州西湖、Tokyo">
      <button id="saveCity" data-t="save">保存</button>
      <button class="ghost" id="autoCity" data-t="auto">自动定位</button>
    </div>
    <div class="status" id="cityStatus"></div>
  </section>
</main>
<script>
(function () {
  var zh = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0;
  var EN = {
    title: 'AweHome', device: 'TV', wallTitle: 'Wallpaper folder',
    wallHint: 'Send a few photos from your phone to the TV. Click one on the TV to delete it.',
    choose: 'Choose photos', useFolder: 'Use as background', wallsEmpty: 'No photos yet.',
    iconTitle: 'App pictures', iconHint: "Give an app's tile a picture of your own; it is cropped to 16:9.",
    chooseIcon: 'Choose picture', resetIcon: 'Reset', weatherTitle: 'Weather city', save: 'Save', auto: 'Locate automatically',
    cityHint: 'e.g. Shanghai, Tokyo', sending: 'Sending…', sent: 'Sent: ', none: 'Nothing was sent.', deleted: 'Deleted.',
    using: 'The TV now shows this folder.', saved: 'Saved.', notFound: 'No such place.', auto2: 'Locating from the network.',
    now: 'Now: ', autoLabel: ' (automatic)', del: 'Delete'
  };
  var ZH = {
    sending: '正在发送…', sent: '已发送：', none: '没有发送成功。', deleted: '已删除这张图片。', using: '电视已改用墙纸文件夹。',
    saved: '已保存。', notFound: '找不到这个地方。', auto2: '已改为按网络自动定位。', now: '现在：', autoLabel: '（自动）', del: '删除'
  };
  function t(k) { return zh ? (ZH[k] || null) : EN[k]; }
  if (!zh) {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-t]').forEach(function (e) { if (EN[e.dataset.t]) e.textContent = EN[e.dataset.t]; });
    document.querySelectorAll('[data-p]').forEach(function (e) { e.placeholder = EN[e.dataset.p]; });
  }
  var base = location.pathname.replace(/\/?$/, '/');
  function $(id) { return document.getElementById(id); }
  function post(path, body) {
    return fetch(base + path, { method: 'POST', body: body }).then(function (r) { return r.json(); });
  }
  function form(obj) { var f = new URLSearchParams(); for (var k in obj) f.append(k, obj[k]); return f; }

  function render(s) {
    var walls = $('walls');
    walls.innerHTML = '';
    $('wallsEmpty').style.display = s.wallpapers.length ? 'none' : 'block';
    s.wallpapers.forEach(function (w) {
      var d = document.createElement('div'); d.className = 'thumb';
      var img = document.createElement('img'); img.src = base + 'thumb/' + encodeURIComponent(w.name); img.loading = 'lazy';
      var b = document.createElement('button'); b.textContent = t('del');
      b.onclick = function () { post('api/delete', form({ name: w.name })).then(function (s2) { $('wallStatus').textContent = t('deleted'); render(s2); }); };
      d.appendChild(img); d.appendChild(b); walls.appendChild(d);
    });
    var sel = $('app'), keep = sel.value;
    if (!sel.options.length) {
      s.apps.forEach(function (a) { var o = document.createElement('option'); o.value = a.pkg; o.textContent = a.label; sel.appendChild(o); });
      if (keep) sel.value = keep;
    }
    s.apps.forEach(function (a) { if (a.pkg === sel.value) showPreview(a); });
    var w = s.weather;
    $('weatherNow').textContent = w.place ? t('now') + (w.celsius !== undefined ? w.celsius + '° ' : '') + w.place + (w.kind ? ' · ' + w.kind : '') + (w.chosen ? '' : t('autoLabel')) : '';
    window.__state = s;
  }
  function showPreview(a) {
    $('preview').style.display = a.custom ? 'block' : 'none';
    if (a.custom) $('previewImg').src = base + 'icon/' + encodeURIComponent(a.pkg) + '?' + Date.now();
  }
  function load() { fetch(base + 'api/state').then(function (r) { return r.json(); }).then(render); }

  $('photos').onchange = function (e) {
    var files = e.target.files; if (!files.length) return;
    var f = new FormData(); for (var i = 0; i < files.length; i++) f.append('photo' + (i || ''), files[i]);
    $('wallStatus').textContent = t('sending');
    post('api/upload', f).then(function (s) { $('wallStatus').textContent = s.added ? t('sent') + s.added : t('none'); render(s); });
    e.target.value = '';
  };
  $('useFolder').onclick = function () { post('api/use-folder', form({})).then(function (s) { $('wallStatus').textContent = t('using'); render(s); }); };
  $('app').onchange = function () { (window.__state.apps || []).forEach(function (a) { if (a.pkg === $('app').value) showPreview(a); }); };
  $('icon').onchange = function (e) {
    var file = e.target.files[0]; if (!file) return;
    var f = new FormData(); f.append('picture', file);
    $('iconStatus').textContent = t('sending');
    fetch(base + 'api/icon?app=' + encodeURIComponent($('app').value), { method: 'POST', body: f })
      .then(function (r) { return r.json(); }).then(function (s) { $('iconStatus').textContent = s.saved ? t('saved') : t('none'); render(s); });
    e.target.value = '';
  };
  $('resetIcon').onclick = function () { post('api/icon/reset', form({ app: $('app').value })).then(function (s) { $('iconStatus').textContent = t('saved'); render(s); }); };
  $('saveCity').onclick = function () {
    var name = $('city').value.trim(); if (!name) return;
    post('api/weather/city', form({ name: name })).then(function (s) { $('cityStatus').textContent = s.found ? t('saved') : t('notFound'); render(s); });
  };
  $('autoCity').onclick = function () { post('api/weather/auto', form({})).then(function (s) { $('cityStatus').textContent = t('auto2'); render(s); }); };
  load();
})();
</script>
</body>
</html>
